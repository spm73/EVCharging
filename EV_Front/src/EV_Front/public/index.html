<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Central Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚡ EV Charging Central Monitor</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <h3>Charging Points (CPs)</h3>
                
                <div class="mb-3 d-flex gap-2">
                    <button class="btn btn-danger fw-bold" onclick="stopAllCPs()">🛑 Stop All CPs</button>
                    <button class="btn btn-success fw-bold" onclick="resumeAllCPs()">▶️ Resume All CPs</button>
                </div>

                <div id="cp-container" class="row mb-4">
                </div>

                <div class="d-flex align-items-center gap-3 mb-2">
                    <h3 class="mb-0">Supplies</h3>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="toggle-active-only" checked>
                        <label class="form-check-label" for="toggle-active-only">Active only</label>
                    </div>
                </div>
                <table class="table table-striped bg-white shadow-sm">
                    <thead>
                        <tr>
                            <th>Transaction ID</th>
                            <th>Driver</th>
                            <th>CP ID</th>
                            <th>Consumption (kWh)</th>
                            <th>Total Price</th>
                            <th>Start Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body">
                    </tbody>
                </table>

                <h3 class="mt-4">Registered Drivers</h3>
                <table class="table table-striped bg-white shadow-sm mb-4">
                    <thead>
                        <tr>
                            <th>Driver ID</th>
                            <th>Status / Active Supply</th>
                        </tr>
                    </thead>
                    <tbody id="drivers-body">
                    </tbody>
                </table>
            </div>

            <div class="col-md-4">
                <h3>System Logs & EV_Weather</h3>
                
                <div class="d-flex gap-2 mb-2">
                    <input type="text" id="filter-ip" class="form-control form-control-sm" placeholder="Filter IP (e.g., 192.168.1.1)">
                    <input type="text" id="filter-action" class="form-control form-control-sm" placeholder="Filter Action (e.g., auth, error)">
                </div>

                <div class="bg-dark text-success p-3 rounded shadow-sm" style="height: 75vh; overflow-y: auto; font-family: monospace;" id="logs-container">
                    > System initialized...<br>
                </div>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="app.js"></script>
</body>
</html>
