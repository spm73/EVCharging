<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Central Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚡ EV Charging Central Monitor</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <h3>Puntos de Recarga (CPs)</h3>
                <div id="cp-container" class="row mb-4">
                    </div>

                <h3>Suministros Activos</h3>
                <table class="table table-striped bg-white shadow-sm">
                    <thead>
                        <tr>
                            <th>ID Transacción</th>
                            <th>Conductor</th>
                            <th>CP ID</th>
                            <th>Consumo (kWh)</th>
                            <th>Precio Total</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body">
                        </tbody>
                </table>
            </div>

            <div class="col-md-4">
                <h3>System Logs & EV_Weather</h3>
                <div class="bg-dark text-success p-3 rounded shadow-sm" style="height: 80vh; overflow-y: auto; font-family: monospace;" id="logs-container">
                    > Sistema inicializado...<br>
                </div>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="app.js"></script>
</body>
</html>
