services:
  mariadb:
    image: mariadb:latest
    container_name: db
    restart: always
    ports:
      - "13306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "@pr0bar_SD"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - central_net
  
  kafka-broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.18.13:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - central_net
  
  init-kafka:
    image: apache/kafka:latest
    container_name: init-kafka
    depends_on:
      - kafka-broker
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "
      while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --list; do sleep 2; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic cp.active.listing;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.request.users;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.request.cps;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.request.notifications;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.response;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.telemetry.users;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.telemetry.cp;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic cp.commands;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic cp.start-supply;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --create --if-not-exists --topic supply.errors;
      "
    networks:
      - central_net

  ev_registry:
    build:
      context: ../..
      dockerfile: EV_Registry/Dockerfile
    container_name: ev_registry_container
    ports:
      - "8000:8000"
    env_file:
      - ../../EV_Registry/.env
    secrets:
      - source: jwt_key
        target: jwt_secret.key
    networks:
      - user_net
    depends_on:
      - mariadb
  
  ev_central:
    build:
      context: ../..
      dockerfile: EV_Central/Dockerfile
    container_name: ev_central_container
    ports:
      - "8001:8000"
      - "7000:7000"
    env_file:
      - ../../EV_Central/.env
    secrets:
      - source: jwt_key
        target: jwt_secret.key
    networks:
      - central_net
    depends_on:
      - mariadb

  ev_engine:
    build:
      context: ../..
      dockerfile: EV_CP_E/Dockerfile
    container_name: ev_engine
    ports:
      - "9000:9000"
    env_file:
      - ../../EV_CP_E/.env
    volumes:
      - cp1_engine_data:/data
    networks:
      - edge_net

  ev_monitor:
    build:
      context: ../..
      dockerfile: EV_CP_M/Dockerfile
    container_name: ev_monitor
    env_file:
      - ../../EV_CP_M/.env
    environment:
      - TERM=xterm-256color
    volumes:
      - ../../certificates/certs_cp1/cp.crt:/certs/cp.crt:ro
      - ../../certificates/certs_cp1/cp.key:/certs/cp.key:ro
      - cp1_monitor_data:/data
    stdin_open: true
    tty: true
    networks:
      - edge_net

  ev_driver:
    build:
      context: ../..
      dockerfile: EV_Driver/Dockerfile
    env_file:
      - ../../EV_Driver/.env
    environment:
      - TERM=xterm-256color
    restart: on-failure
    command: >
      sh -c "uv run --package ev-driver python -m EV_Driver.main 
      --ip $$DRIVER_IP 
      --broker-ip $$BROKER_IP 
      --broker-port $$BROKER_PORT 
      --id $$DRIVER_ID 
      --file $$CP_FILE"
    networks:
      - user_net

  # ==========================================
  # 2. EL CLIMA (EV_Weather / EV_W)
  # ==========================================
  ev_w:
    build:
      context: ../..
      dockerfile: EV_W/Dockerfile
    env_file:
      - ../../EV_W/.env
    environment:
      - TERM=xterm-256color
    # ¡SÚPER IMPORTANTE! Estas dos líneas permiten que la terminal 
    # se quede abierta para que puedas usar el menú interactivo con el teclado
    stdin_open: true 
    tty: true
    networks:
      - edge_net

  # ==========================================
  # 3. EL FRONTEND (EV_Front)
  # ==========================================
  ev_front:
    build:
      context: ../../EV_Front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../EV_Front/.env
    restart: always
    networks:
      - central_net

volumes: 
  mariadb-data:
  kafka-data:
  cp1_engine_data:
  cp1_monitor_data:

secrets:
  jwt_key:
    file: ../../certificates/jwt_secret.key

networks:
  central_net:
    driver: bridge
  edge_net:
    driver: bridge
  user_net:
    driver: bridge
